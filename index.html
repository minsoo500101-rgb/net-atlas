<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Net Atlas — 통신한 지점들</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #050810;
    --land: #131a2e;
    --land-stroke: #233052;
    --grid: #0f1626;
    --you: #7cf3c3;
    --target: #82d8ff;
    --arc: #82d8ff;
    --text: #e6ecff;
    --dim: #8895b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a1020 0%, #050810 70%);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Consolas', 'D2Coding', monospace;
  }
  #map { position: absolute; inset: 0; width: 100vw; height: 100vh; }
  .header { position: absolute; top: 16px; left: 20px; z-index: 10; pointer-events: none; }
  .header h1 {
    font-size: 12px; letter-spacing: 6px; font-weight: 500;
    color: var(--dim); margin-bottom: 6px;
  }
  .header h1::before {
    content: ''; display: inline-block;
    width: 6px; height: 6px; background: var(--you);
    border-radius: 50%; margin-right: 8px;
    vertical-align: middle;
    animation: blip 1.6s infinite;
  }
  @keyframes blip { 0%,100% {opacity:1;} 50% {opacity:0.3;} }
  .header .sub { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .header .you { font-size: 11px; color: var(--you); margin-top: 10px; letter-spacing: 1px; }

  .stats {
    position: absolute; top: 16px; right: 20px; z-index: 10;
    font-size: 10px; color: var(--dim); text-align: right;
    display: flex; gap: 18px;
  }
  .stats > div { line-height: 1.2; }
  .stats .num { color: var(--text); font-size: 22px; font-weight: 300; letter-spacing: 1px; }
  .stats .label { letter-spacing: 2px; text-transform: uppercase; }

  .controls {
    position: absolute; bottom: 16px; left: 20px; right: 20px; z-index: 10;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .controls input, .controls button {
    font-family: inherit; font-size: 11px;
    background: rgba(10,14,26,0.7); color: var(--text);
    border: 1px solid var(--land-stroke);
    padding: 7px 11px; border-radius: 4px;
    backdrop-filter: blur(8px);
  }
  .controls input { width: 220px; }
  .controls input::placeholder { color: var(--dim); }
  .controls button { cursor: pointer; transition: all .2s; }
  .controls button:hover { border-color: var(--you); color: var(--you); }
  .controls button.active {
    border-color: var(--you); color: var(--you);
    background: rgba(124,243,195,0.08);
  }
  .preset {
    color: var(--dim) !important; font-size: 10px !important;
    padding: 5px 8px !important;
  }
  .preset:hover { color: var(--target) !important; border-color: var(--target) !important; }
  .divider {
    width: 1px; height: 20px; background: var(--land-stroke);
    margin: 0 4px;
  }
  .label-inline { font-size: 10px; color: var(--dim); letter-spacing: 1px; }

  .log {
    position: absolute; bottom: 70px; left: 20px; z-index: 10;
    font-size: 10px; color: var(--dim);
    width: 340px; max-height: 240px; overflow-y: auto;
    background: rgba(10,14,26,0.55); padding: 10px 12px; border-radius: 6px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(42,53,83,0.5);
  }
  .log-entry {
    padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
    display: grid; grid-template-columns: 48px 1fr 80px; gap: 8px;
    animation: fadein 0.3s ease;
  }
  @keyframes fadein { from{opacity:0;transform:translateX(-4px);} to{opacity:1;transform:none;} }
  .log-entry .t { color: var(--dim); font-size: 9px; }
  .log-entry .h { color: var(--target); }
  .log-entry .c { color: var(--dim); font-size: 9px; text-align: right; }
  .log-entry.fail .h { color: #ff6b8a; opacity: 0.7; }

  .legend {
    position: absolute; bottom: 60px; right: 20px; z-index: 10;
    font-size: 10px; color: var(--dim); text-align: right;
    background: rgba(10,14,26,0.55); padding: 6px 10px; border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .legend span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px -1px 8px; }
  .legend .y { background: var(--you); box-shadow: 0 0 6px var(--you); }
  .legend .t { background: var(--target); box-shadow: 0 0 6px var(--target); }
  .legend .w { background: #b682ff; box-shadow: 0 0 6px #b682ff; }
  .legend .m { background: #5ec4ff; box-shadow: 0 0 6px #5ec4ff; }
  .legend .e { background: #ff7a5c; box-shadow: 0 0 6px #ff7a5c; }
  .legend .n { background: #ff9966; box-shadow: 0 0 6px #ff9966; }
  .legend .i { background: #ffe066; box-shadow: 0 0 8px #ffe066; }

  .ticker {
    margin-top: 10px;
    display: flex; gap: 16px;
    font-size: 10px; color: var(--dim); letter-spacing: 1px;
    pointer-events: none;
  }
  .ticker b { color: var(--text); margin-right: 4px; font-weight: 500; font-size: 13px; }
  .speed-btn {
    cursor: pointer; pointer-events: auto;
    background: rgba(255,224,102,0.1);
    color: #ffe066;
    padding: 1px 7px; border-radius: 3px;
    border: 1px solid rgba(255,224,102,0.3);
    font-size: 10px; letter-spacing: 0.5px;
    transition: background .15s;
  }
  .speed-btn:hover { background: rgba(255,224,102,0.2); }

  .streams-bar { display: flex; gap: 6px; margin-top: 10px; pointer-events: auto; flex-wrap: wrap; }
  .stream-toggle {
    font-family: inherit; font-size: 10px; letter-spacing: 0.5px;
    background: rgba(10,14,26,0.7); color: var(--dim);
    border: 1px solid var(--land-stroke); padding: 5px 9px;
    border-radius: 4px; cursor: pointer;
    backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .2s;
  }
  .stream-toggle:hover { color: var(--text); }
  .stream-toggle.active { color: var(--text); border-color: rgba(255,255,255,0.25); }
  .stream-toggle .dot {
    width: 6px; height: 6px; border-radius: 50%; opacity: 0.4;
    transition: opacity .3s, box-shadow .3s;
  }
  .stream-toggle.active .dot { opacity: 1; }
  .stream-toggle .s-wiki { background: #b682ff; }
  .stream-toggle.active .s-wiki { box-shadow: 0 0 6px #b682ff; animation: streampulse 1.4s infinite; }
  .stream-toggle .s-bsky { background: #5ec4ff; }
  .stream-toggle.active .s-bsky { box-shadow: 0 0 6px #5ec4ff; animation: streampulse 1.4s infinite; }
  .stream-toggle .s-eq { background: #ff7a5c; }
  .stream-toggle.active .s-eq { box-shadow: 0 0 6px #ff7a5c; animation: streampulse 1.4s infinite; }
  .stream-toggle .s-eonet { background: #ff9966; }
  .stream-toggle.active .s-eonet { box-shadow: 0 0 6px #ff9966; animation: streampulse 1.4s infinite; }
  .stream-toggle .s-iss { background: #ffe066; }
  .stream-toggle.active .s-iss { box-shadow: 0 0 6px #ffe066; animation: streampulse 1.4s infinite; }
  @keyframes streampulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--land-stroke); border-radius: 2px; }

  /* Tooltip on hover */
  .tooltip {
    position: fixed;
    background: rgba(10, 14, 26, 0.96);
    border: 1px solid rgba(124, 243, 195, 0.3);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
    z-index: 100;
    max-width: 320px;
    display: none;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    line-height: 1.5;
  }
  .tooltip.show { display: block; }
  .tooltip .tt-title {
    color: var(--accent); margin-bottom: 4px;
    font-weight: 500; letter-spacing: 0.5px; font-size: 12px;
  }
  .tooltip .tt-body { color: var(--text); }
  .tooltip .tt-sub {
    color: var(--dim); font-size: 10px; margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
  .tip-target { cursor: help; }
</style>
</head>
<body>
<svg id="map"></svg>
<div class="tooltip" id="tooltip"></div>

<div class="header">
  <h1>NET ATLAS</h1>
  <div class="sub">실시간으로 흐르는 인터넷</div>
  <div class="you" id="you">→ 위치 확인 중…</div>
  <div class="streams-bar" id="streams-bar">
    <button class="stream-toggle active" data-stream="wiki"><span class="dot s-wiki"></span>Wikipedia <span id="stream-wiki-count">0</span></button>
    <button class="stream-toggle active" data-stream="bsky"><span class="dot s-bsky"></span>Bluesky <span id="stream-bsky-count">0</span></button>
    <button class="stream-toggle active" data-stream="eq"><span class="dot s-eq"></span>Earthquakes <span id="stream-eq-count">0</span></button>
    <button class="stream-toggle active" data-stream="eonet"><span class="dot s-eonet"></span>Disasters <span id="stream-eonet-count">0</span></button>
    <button class="stream-toggle active" data-stream="sats"><span class="dot s-iss"></span>Satellites</button>
  </div>
  <div class="ticker" id="ticker">
    <span><b id="t-wiki">0</b>편집/분</span>
    <span><b id="t-bsky">0</b>포스트/분</span>
    <span><b id="t-eonet">0</b>재해</span>
    <span><b id="t-iss">—</b></span>
    <span class="speed-btn" id="speed-btn" title="time multiplier">60×</span>
  </div>
</div>

<div class="stats">
  <div><div class="num" id="stat-points">0</div><div class="label">지점</div></div>
  <div><div class="num" id="stat-links">0</div><div class="label">연결</div></div>
  <div><div class="num" id="stat-countries">0</div><div class="label">국가</div></div>
</div>

<div class="log" id="log"></div>

<div class="legend">
  <span class="y"></span>나
  <span class="t"></span>호스트
  <span class="w"></span>위키
  <span class="m"></span>블루스카이
  <span class="e"></span>지진
  <span class="n"></span>재해
  <span class="i"></span>위성
</div>

<div class="controls">
  <input id="custom" type="text" placeholder="hostname (예: github.com)" autocomplete="off" />
  <button id="ping-btn">Ping</button>
  <button id="auto-btn">Auto ▶</button>
  <button id="clear-btn">Clear</button>
  <div class="divider"></div>
  <span class="label-inline">PRESETS</span>
  <button class="preset" data-host="github.com">github</button>
  <button class="preset" data-host="wikipedia.org">wikipedia</button>
  <button class="preset" data-host="naver.com">naver</button>
  <button class="preset" data-host="bbc.co.uk">bbc</button>
  <button class="preset" data-host="nhk.or.jp">nhk</button>
  <button class="preset" data-host="lemonde.fr">lemonde</button>
  <button class="preset" data-host="abc.net.au">abc.au</button>
  <button class="preset" data-host="globo.com">globo</button>
  <button class="preset" data-host="aljazeera.com">aljazeera</button>
  <button class="preset" data-host="yandex.ru">yandex</button>
  <button class="preset" data-host="taobao.com">taobao</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

try { rtf = new Intl.RelativeTimeFormat(LANG, { numeric: 'auto' }); } catch {}
function timeAgo(date) {
  if (!rtf || !date) return '';
  const diff = (date.getTime() - Date.now()) / 1000;
  const abs = Math.abs(diff);
  if (abs < 60)       return rtf.format(Math.round(diff), 'second');
  if (abs < 3600)     return rtf.format(Math.round(diff/60), 'minute');
  if (abs < 86400)    return rtf.format(Math.round(diff/3600), 'hour');
  if (abs < 86400*30) return rtf.format(Math.round(diff/86400), 'day');
  return rtf.format(Math.round(diff/(86400*30)), 'month');
}

const ttEl = document.getElementById('tooltip');
function tipShow(evt, html) {
  ttEl.innerHTML = html;
  ttEl.classList.add('show');
  tipMove(evt);
}
function tipMove(evt) {
  const pad = 14;
  const w = ttEl.offsetWidth, h = ttEl.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w + pad > window.innerWidth)  x = evt.clientX - w - pad;
  if (y + h + pad > window.innerHeight) y = evt.clientY - h - pad;
  ttEl.style.left = x + 'px';
  ttEl.style.top = y + 'px';
}
function tipHide() { ttEl.classList.remove('show'); }

function attachTip(d3sel, htmlFn) {
  d3sel
    .classed('tip-target', true)
    .style('pointer-events', 'auto')
    .on('mouseenter', function(evt) { tipShow(evt, htmlFn()); })
    .on('mousemove',  function(evt) { tipMove(evt); })
    .on('mouseleave', tipHide);
}

// Great-circle path as LineString sampled for projection
function greatCircle(a, b, segments = 64) {
  const interp = d3.geoInterpolate(a, b);
  const coords = [];
  for (let i = 0; i <= segments; i++) coords.push(interp(i / segments));
  return { type: 'LineString', coordinates: coords };
}

function drawArc(a, b) {
  if (!a || !b) return;
  const d = path(greatCircle(a, b));
  if (!d) return;
  const arc = gArcs.append('path')
    .attr('d', d)
    .attr('fill', 'none')
    .attr('stroke', '#82d8ff')
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.85)
    .style('filter', 'drop-shadow(0 0 3px rgba(130,216,255,0.6))');
  const len = arc.node().getTotalLength();
  arc.attr('stroke-dasharray', `${len} ${len}`)
    .attr('stroke-dashoffset', len)
    .transition().duration(1400).ease(d3.easeCubicOut)
    .attr('stroke-dashoffset', 0)
    .transition().delay(4000).duration(8000)
    .attr('stroke-opacity', 0.18)
    .style('filter', 'none');
}

function spawnPulse(x, y, color, maxR = 18) {
  gDots.append('circle')
    .attr('cx', x).attr('cy', y).attr('r', 3)
    .attr('fill', 'none').attr('stroke', color).attr('stroke-width', 1.2)
    .attr('opacity', 0.8)
    .transition().duration(2000).ease(d3.easeCubicOut)
    .attr('r', maxR).attr('opacity', 0)
    .remove();
}

function drawDot([lon, lat], kind, host) {
  const projected = projection([lon, lat]);
  if (!projected) return;
  const [x, y] = projected;
  const color = kind === 'you' ? '#7cf3c3' : '#82d8ff';
  const r = kind === 'you' ? 4 : 2.5;

  // initial pulse
  spawnPulse(x, y, color, kind === 'you' ? 22 : 14);

  // persistent dot
  gDots.append('circle')
    .attr('cx', x).attr('cy', y).attr('r', 0)
    .attr('fill', color)
    .style('filter', `drop-shadow(0 0 4px ${color})`)
    .transition().duration(400).attr('r', r);

  // hostname label
  if (host) {
    gLabels.append('text')
      .attr('x', x + 6).attr('y', y - 5)
      .attr('font-size', 9)
      .attr('font-family', 'JetBrains Mono, Consolas, monospace')
      .attr('fill', kind === 'you' ? '#7cf3c3' : '#8895b8')
      .attr('opacity', 0)
      .text(host)
      .transition().duration(600).attr('opacity', 0.85);
  }

  // recurring pulse for "you"
  if (kind === 'you') {
    setInterval(() => spawnPulse(x, y, color, 22), 2200);
  }
}

// DNS-over-HTTPS (Cloudflare) — resolves hostname → IP from the browser
async function resolveHostToIP(host) {
  const r = await origFetch(
    `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`,
    { headers: { Accept: 'application/dns-json' } }
  );
  if (!r.ok) throw new Error(`DoH HTTP ${r.status}`);
  const j = await r.json();
  const ans = (j.Answer || []).find(a => a.type === 1);
  if (!ans) throw new Error('no A record');
  return ans.data;
}

// IP → coords via ipapi.co (ipwho.is started returning 403 for everything)
async function ipToCoords(ip) {
  const r = await origFetch(`https://ipapi.co/${ip}/json/`);
  if (!r.ok) throw new Error(`ipapi HTTP ${r.status}`);
  const j = await r.json();
  if (j.error || j.latitude == null) throw new Error(j.reason || 'ipapi no geo');
  return { lat: j.latitude, lon: j.longitude, city: j.city, country: j.country_name || j.country };
}

async function lookupHost(host) {
  // 1) Pre-baked lookup — instant, no network, no quota burn
  if (KNOWN_HOSTS[host]) return KNOWN_HOSTS[host];
  // 2) DoH + ipapi for arbitrary user-typed hosts
  const ip = await resolveHostToIP(host);
  return await ipToCoords(ip);
}

async function plotHost(host) {
  if (!host) return;

  // already known → just draw a new arc (a fresh "communication")
  if (plottedHosts.has(host)) {
    const info = plottedHosts.get(host);
    if (youCoords) {
      drawArc(youCoords, [info.lon, info.lat]);
      linkCount++; updateStats();
    }
    return;
  }

  try {
    const info = await lookupHost(host);
    if (info.lon == null || info.lat == null) {
      logEntry(host, '', 'no geo'); return;
    }
    plottedHosts.set(host, info);
    if (info.country) countrySet.add(info.country);
    drawDot([info.lon, info.lat], 'target', host);
    if (youCoords) { drawArc(youCoords, [info.lon, info.lat]); linkCount++; }
    logEntry(host, info.city ? `${info.city}, ${info.country}` : info.country);
    updateStats();
  } catch (e) {
    logEntry(host, '', 'fail');
  }
}

}

  code = code.toLowerCase().replace('_','-');
  if (POOLS[code]) {
    const p = POOLS[code][Math.floor(Math.random()*POOLS[code].length)];
    return [p[0] + (Math.random()-0.5)*4, p[1] + (Math.random()-0.5)*4];
  }
  const base = code.split('-')[0];
  if (POOLS[base]) {
    const p = POOLS[base][Math.floor(Math.random()*POOLS[base].length)];
    return [p[0] + (Math.random()-0.5)*4, p[1] + (Math.random()-0.5)*4];
  }
  if (WIKI_SINGLE[base]) {
    const p = WIKI_SINGLE[base];
    return [p[0] + (Math.random()-0.5)*3, p[1] + (Math.random()-0.5)*3];
  }
  return null;
}

function wikiLocationFor(wiki) {
  // wiki examples: 'enwiki', 'kowiki', 'zh_yuewiki', 'commonswiki', 'wikidatawiki'
  if (wiki === 'commonswiki' || wiki === 'wikidatawiki' || wiki === 'metawiki') {
    return [(Math.random()*120 - 50), (Math.random()*340 - 170)];
  }
  const m = wiki.match(/^([a-z_-]+?)wiki(?:books|news|quote|source|versity|voyage)?$/);
  if (!m) return null;
  return locationForLang(m[1]);
}

// --- Streams state ---
let wikiES = null, wikiCount = 0, wikiQueue = [];
let bskyWS = null, bskyCount = 0, bskyQueue = [];
let eqTimer = null, eqCount = 0, eqDots = new Map();
let eonetTimer = null, eonetCount = 0, eonetDots = new Map();
let satsTimer = null, satMarkers = new Map(), satTrails = new Map();

const streamSkip = new Set([
  'stream.wikimedia.org', 'jetstream2.us-east.bsky.network', 'earthquake.usgs.gov',
  'eonet.gsfc.nasa.gov', 'celestrak.org',
]);
streamSkip.forEach(h => skipHosts.add(h));

// Per-minute rate tracking
const rateBuckets = { wiki: [], bsky: [] };
function tickRate(kind) {
  const now = Date.now();
  rateBuckets[kind].push(now);
  rateBuckets[kind] = rateBuckets[kind].filter(t => now - t < 60000);
}
setInterval(() => {
  $('t-wiki').textContent = rateBuckets.wiki.length;
  $('t-bsky').textContent = rateBuckets.bsky.length;
  $('t-eonet').textContent = eonetDots.size;
}, 1000);

// --- Wikipedia firehose ---
function startWiki() {
  if (wikiES) return;
  try {
    wikiES = new EventSource('https://stream.wikimedia.org/v2/stream/recentchange');
    wikiES.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type !== 'edit' && d.type !== 'new') return;
        if (d.bot) return; // drop bot edits (the firehose is mostly bots otherwise)
        wikiQueue.push(d);
        if (wikiQueue.length > 50) wikiQueue.shift();
      } catch {}
    };
    wikiES.onerror = () => { /* will auto-reconnect */ };
  } catch (e) {
    console.error('wiki stream failed', e);
  }
}
function stopWiki() {
  if (wikiES) { wikiES.close(); wikiES = null; }
}
// Pull from queue at a fixed visual rate (≈ 8 events/sec drawn)
setInterval(() => {
  if (!wikiES || wikiQueue.length === 0) return;
  const d = wikiQueue.shift();
  const loc = wikiLocationFor(d.wiki);
  if (!loc) return;
  const [lat, lon] = loc;
  const projected = projection([lon, lat]);
  if (!projected) return;
  wikiCount++; tickRate('wiki');
  $('stream-wiki-count').textContent = wikiCount;
  spawnPulse(projected[0], projected[1], '#b682ff', 12);
  if (wikiCount % 5 === 0) {
    const lang = (d.wiki.match(/^([a-z_-]+?)wiki/) || [,'??'])[1];
    logEntry(d.wiki, lang.toUpperCase() + ' · ' + (d.title || '').slice(0,40), 'wiki');
  }
}, 120);

// --- Bluesky Jetstream (public WebSocket, no auth) ---
function startBsky() {
  if (bskyWS) return;
  try {
    bskyWS = new WebSocket('wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post');
    bskyWS.onmessage = (msg) => {
      try {
        const d = JSON.parse(msg.data);
        if (d.kind !== 'commit') return;
        const rec = d.commit?.record;
        if (!rec || rec.$type !== 'app.bsky.feed.post') return;
        bskyQueue.push(rec);
        if (bskyQueue.length > 100) bskyQueue.shift();
      } catch {}
    };
    bskyWS.onclose = () => { bskyWS = null; };
    bskyWS.onerror = () => {};
  } catch (e) { console.error('bsky', e); }
}
function stopBsky() {
  if (bskyWS) { bskyWS.close(); bskyWS = null; }
}
setInterval(() => {
  if (!bskyWS || bskyQueue.length === 0) return;
  const rec = bskyQueue.shift();
  const lang = (rec.langs && rec.langs[0]) || 'en'; // default to en pool
  const loc = locationForLang(lang);
  if (!loc) return;
  const [lat, lon] = loc;
  const projected = projection([lon, lat]);
  if (!projected) return;
  bskyCount++; tickRate('bsky');
  $('stream-bsky-count').textContent = bskyCount;
  spawnPulse(projected[0], projected[1], '#5ec4ff', 10);
  if (bskyCount % 8 === 0) {
    logEntry('bsky', lang.toUpperCase() + ' · ' + (rec.text || '').slice(0, 50), 'bsky');
  }
}, 150);

// --- NASA EONET: open natural events (wildfires, volcanoes, storms, floods) ---
const EONET_CATEGORY = {
  Wildfires:        { icon: '🔥', color: '#ff6b3a' },
  Volcanoes:        { icon: '🌋', color: '#ff5050' },
  'Severe Storms':  { icon: '🌀', color: '#82d8ff' },
  Floods:           { icon: '💧', color: '#5cc8ff' },
  'Sea and Lake Ice': { icon: '🧊', color: '#9adfff' },
  'Snow':           { icon: '❄️', color: '#c0d8ff' },
  'Drought':        { icon: '☀️', color: '#ffd86b' },
  Earthquakes:      { icon: '🌍', color: '#ff9966' },
  'Landslides':     { icon: '⛰️', color: '#cca066' },
  Dust:             { icon: '💨', color: '#d4a878' },
};
function drawEonetDot([lon, lat], category, title, date) {
  const projected = projection([lon, lat]);
  if (!projected) return;
  const [x, y] = projected;
  const meta = EONET_CATEGORY[category] || { icon: '⚠️', color: '#ff9966' };
  spawnPulse(x, y, meta.color, 16);
  const text = gDots.append('text')
    .attr('x', x).attr('y', y + 4)
    .attr('text-anchor', 'middle').attr('font-size', 14)
    .style('filter', `drop-shadow(0 0 4px ${meta.color})`)
    .attr('opacity', 0)
    .text(meta.icon);
  text.transition().duration(500).attr('opacity', 0.9);
  attachTip(text, () => `
    <div class="tt-title">${meta.icon} ${t(category)}</div>
    <div class="tt-body">${(title || '').replace(/[<>]/g,'')}</div>
    <div class="tt-sub">
      ${Math.abs(lat).toFixed(2)}°${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(2)}°${lon>=0?'E':'W'}
      ${date ? ' · ' + t('Started') + ' ' + timeAgo(new Date(date)) : ''}
    </div>
  `);
  logEntry('NASA', `${meta.icon} ${t(category)} · ${(title||'').slice(0,32)}`, 'eonet');
}
async function fetchEonet() {
  try {
    const r = await origFetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=200&days=30');
    if (!r.ok) return;
    const j = await r.json();
    for (const ev of j.events || []) {
      if (eonetDots.has(ev.id)) continue;
      const cat = ev.categories?.[0]?.title || 'Event';
      const g = ev.geometry?.[ev.geometry.length - 1];
      if (!g?.coordinates) continue;
      const coords = Array.isArray(g.coordinates[0]) ? g.coordinates[0] : g.coordinates;
      drawEonetDot([coords[0], coords[1]], cat, ev.title, g.date);
      eonetDots.set(ev.id, true);
      eonetCount++;
    }
    $('stream-eonet-count').textContent = eonetCount;
  } catch {}
}
function startEonet() {
  if (eonetTimer) return;
  fetchEonet();
  eonetTimer = setInterval(fetchEonet, 5 * 60 * 1000);
}
function stopEonet() {
  if (eonetTimer) { clearInterval(eonetTimer); eonetTimer = null; }
}

// --- Satellites: TLE-based orbit propagation (works for any satellite) ---
const SATELLITES = [
  { id: '25544', name: 'ISS',      color: '#ffe066' },
  { id: '48274', name: 'Tiangong', color: '#ff82d8' },
  { id: '20580', name: 'Hubble',   color: '#82ffe0' },
  { id: '44713', name: 'Starlink', color: '#a8d8ff' },
];
const satRecs = new Map(); // norad -> satellite.satrec
async function loadTLE(sat) {
  try {
    const r = await origFetch(`https://celestrak.org/NORAD/elements/gp.php?CATNR=${sat.id}&FORMAT=tle`);
    if (!r.ok) return;
    const txt = (await r.text()).trim();
    const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
    let l1, l2;
    if (lines.length >= 3) { l1 = lines[1]; l2 = lines[2]; }
    else if (lines.length === 2) { l1 = lines[0]; l2 = lines[1]; }
    else return;
    const satrec = satellite.twoline2satrec(l1, l2);
    satRecs.set(sat.id, satrec);
  } catch {}
}
function propagateSatAt(satrec, date) {
  const pv = satellite.propagate(satrec, date);
  if (!pv || !pv.position) return null;
  const gmst = satellite.gstime(date);
  const geo = satellite.eciToGeodetic(pv.position, gmst);
  const lat = satellite.degreesLat(geo.latitude);
  const lon = satellite.degreesLong(geo.longitude);
  const altitude = geo.height; // km
  let speed = null;
  if (pv.velocity) {
    const v = pv.velocity;
    speed = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z) * 3600;
  }
  return { lat, lon, speed, altitude };
}

// --- Time multiplier for visualization ---
const SPEED_STEPS = [1, 10, 60, 300];
let speedIdx = 2; // 60×
let satSimEpoch = Date.now(); // accumulated simulated wall-clock "now"
let satWallEpoch = Date.now();
function currentSimTime() {
  return new Date(satSimEpoch + (Date.now() - satWallEpoch) * SPEED_STEPS[speedIdx]);
}
function setSpeedIdx(i) {
  // Lock current sim time before changing rate so we don't jump
  satSimEpoch = currentSimTime().getTime();
  satWallEpoch = Date.now();
  speedIdx = (i + SPEED_STEPS.length) % SPEED_STEPS.length;
  const btn = $('speed-btn');
  if (btn) btn.textContent = SPEED_STEPS[speedIdx] + '×';
}
$('speed-btn').addEventListener('click', () => setSpeedIdx(speedIdx + 1));

// --- 30Hz setInterval-driven satellite loop (works in both foreground and background tabs) ---
let satTickHandle = null;
let issTickerLast = 0;
const lastTrailWall = new Map();

async function satLoop() {
  // Load TLEs lazily once
  for (const sat of SATELLITES) {
    if (!satRecs.has(sat.id)) await loadTLE(sat);
  }
  const tick = () => {
    if (!satTickHandle) return;
    const simNow = currentSimTime();
    for (const sat of SATELLITES) {
      const rec = satRecs.get(sat.id);
      if (!rec) continue;
      const pos = propagateSatAt(rec, simNow);
      if (!pos) continue;
      sat.latest = pos;
      placeSat(sat, pos);
    }
    const now = performance.now();
    if (now - issTickerLast > 100) {
      issTickerLast = now;
      const iss = SATELLITES.find(s => s.id === '25544');
      if (iss && iss.latest) {
        const p = iss.latest;
        const v = Math.round(p.speed || 0);
        const where = (p.lat > 0 ? 'N' : 'S') + Math.abs(p.lat).toFixed(0) + ' ' +
                      (p.lon > 0 ? 'E' : 'W') + Math.abs(p.lon).toFixed(0);
        $('t-iss').textContent = `ISS ${v.toLocaleString()}km/h @${where}`;
      }
    }
  };
  satTickHandle = setInterval(tick, 33); // ~30 fps
}

function placeSat(sat, pos) {
  const projected = projection([pos.lon, pos.lat]);
  if (!projected) return;
  const [x, y] = projected;
  let g = satMarkers.get(sat.id);
  if (!g) {
    g = gDots.append('g').attr('class', 'sat-group');
    g.append('circle').attr('r', 8).attr('fill', 'none')
      .attr('stroke', sat.color).attr('stroke-width', 1).attr('opacity', 0.45);
    g.append('circle').attr('r', 3.5).attr('fill', sat.color)
      .style('filter', `drop-shadow(0 0 6px ${sat.color})`);
    g.append('text').attr('font-size', 9).attr('fill', sat.color)
      .attr('opacity', 0.9).attr('x', 8).attr('y', -6).text(sat.name);
    attachTip(g, () => {
      const p = sat.latest || {};
      return `
        <div class="tt-title">${sat.name} — ${t(sat.name)}</div>
        <div class="tt-sub">
          ${p.altitude != null ? `<div class="tt-row"><span>${t('Altitude')}</span><span>${p.altitude.toFixed(0)} km</span></div>` : ''}
          ${p.speed != null ? `<div class="tt-row"><span>${t('Velocity')}</span><span>${Math.round(p.speed).toLocaleString()} km/h</span></div>` : ''}
          ${p.lat != null ? `<div class="tt-row"><span>${t('Position')}</span><span>${Math.abs(p.lat).toFixed(2)}°${p.lat>=0?'N':'S'}, ${Math.abs(p.lon).toFixed(2)}°${p.lon>=0?'E':'W'}</span></div>` : ''}
        </div>
      `;
    });
    satMarkers.set(sat.id, g);
    satTrails.set(sat.id, []);
  }
  // Update trail at most every 80ms wall time
  const wallNow = performance.now();
  const last = lastTrailWall.get(sat.id) || 0;
  if (wallNow - last > 80) {
    lastTrailWall.set(sat.id, wallNow);
    const trail = satTrails.get(sat.id);
    trail.push([x, y]);
    if (trail.length > 220) trail.shift();
    let trailPath = gDots.select(`path.sat-trail-${sat.id}`);
    if (trailPath.empty()) {
      trailPath = gDots.insert('path', '.sat-group').attr('class', `sat-trail-${sat.id}`)
        .attr('fill', 'none').attr('stroke', sat.color).attr('stroke-width', 1).attr('opacity', 0.35);
    }
    trailPath.attr('d', buildTrailPath(trail));
  }
  // Direct transform update — smooth via rAF, no d3 transition
  g.attr('transform', `translate(${x},${y})`);
}

// Break the trail when it crosses ~half-screen jump (antimeridian wrap)
function buildTrailPath(points) {
  if (points.length < 2) return '';
  let d = '', prev = null;
  for (const p of points) {
    if (prev && Math.abs(p[0] - prev[0]) > width * 0.5) {
      d += ' M' + p[0] + ',' + p[1];
    } else {
      d += (d ? ' L' : 'M') + p[0] + ',' + p[1];
    }
    prev = p;
  }
  return d;
}
function updateSatPosition(sat, lat, lon) {
  const projected = projection([lon, lat]);
  if (!projected) return;
  const [x, y] = projected;
  let g = satMarkers.get(sat.id);
  if (!g) {
    g = gDots.append('g').attr('class', 'sat-group');
    g.append('circle').attr('r', 8).attr('fill', 'none')
      .attr('stroke', sat.color).attr('stroke-width', 1).attr('opacity', 0.45);
    g.append('circle').attr('r', 3.5).attr('fill', sat.color)
      .style('filter', `drop-shadow(0 0 6px ${sat.color})`);
    g.append('text').attr('font-size', 9).attr('fill', sat.color)
      .attr('opacity', 0.9).attr('x', 8).attr('y', -6).text(sat.name);
    // Tooltip attached to the whole group — covers dot + ring + label
    attachTip(g, () => {
      const p = sat.latest || {};
      return `
        <div class="tt-title">${sat.name} — ${t(sat.name)}</div>
        <div class="tt-sub">
          ${p.altitude != null ? `<div class="tt-row"><span>${t('Altitude')}</span><span>${p.altitude.toFixed(0)} km</span></div>` : ''}
          ${p.speed     != null ? `<div class="tt-row"><span>${t('Velocity')}</span><span>${Math.round(p.speed).toLocaleString()} km/h</span></div>` : ''}
          ${p.lat       != null ? `<div class="tt-row"><span>${t('Position')}</span><span>${p.lat.toFixed(2)}°, ${p.lon.toFixed(2)}°</span></div>` : ''}
        </div>
      `;
    });
    satMarkers.set(sat.id, g);
    satTrails.set(sat.id, []);
  }
  const trail = satTrails.get(sat.id);
  trail.push([x, y]);
  if (trail.length > 30) trail.shift();
  let trailPath = gDots.select(`path.sat-trail-${sat.id}`);
  if (trailPath.empty()) {
    trailPath = gDots.insert('path', '.sat-group').attr('class', `sat-trail-${sat.id}`)
      .attr('fill','none').attr('stroke', sat.color).attr('stroke-width', 1).attr('opacity', 0.3);
  }
  trailPath.attr('d', 'M' + trail.map(p => p.join(',')).join(' L'));
  g.transition().duration(4500).ease(d3.easeLinear)
    .attr('transform', `translate(${x},${y})`);
}
function startSats() {
  if (satTickHandle) return;
  satWallEpoch = Date.now();
  satSimEpoch = Date.now();
  satLoop();
}
function stopSats() {
  if (satTickHandle) { clearInterval(satTickHandle); satTickHandle = null; }
  satMarkers.forEach(g => g.remove());
  satMarkers.clear();
  satTrails.clear();
  lastTrailWall.clear();
  gDots.selectAll('[class^="sat-trail-"]').remove();
  $('t-iss').textContent = '—';
}

// --- Earthquakes ---
async function fetchEarthquakes() {
  try {
    const r = await origFetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
    if (!r.ok) return;
    const j = await r.json();
    for (const f of j.features || []) {
      const id = f.id;
      if (eqDots.has(id)) continue;
      const [lon, lat, depth] = f.geometry.coordinates;
      const mag = f.properties.mag || 0;
      const place = f.properties.place || '';
      const time = f.properties.time;
      drawEqDot([lon, lat, depth], mag, place, time);
      eqDots.set(id, true);
      eqCount++;
    }
    $('stream-eq-count').textContent = eqCount;
  } catch {}
}
function drawEqDot([lon, lat, depth], mag, place, time) {
  const projected = projection([lon, lat]);
  if (!projected) return;
  const [x, y] = projected;
  const r = Math.max(1.5, Math.min(8, 1.5 + mag * 0.9));
  const color = mag >= 5 ? '#ff5050' : mag >= 3 ? '#ff7a5c' : '#ffb86b';
  spawnPulse(x, y, color, r * 3);
  const dot = gDots.append('circle').attr('cx', x).attr('cy', y).attr('r', 0)
    .attr('fill', color).attr('fill-opacity', 0.75)
    .style('filter', `drop-shadow(0 0 4px ${color})`);
  dot.transition().duration(400).attr('r', r);
  attachTip(dot, () => `
    <div class="tt-title">${t('Earthquake')} M${mag.toFixed(1)}</div>
    <div class="tt-body">${place || ''}</div>
    <div class="tt-sub">
      <div class="tt-row"><span>${t('Magnitude')}</span><span>${mag.toFixed(1)}</span></div>
      ${depth != null ? `<div class="tt-row"><span>${t('Depth')}</span><span>${depth.toFixed(0)} km</span></div>` : ''}
      <div class="tt-row"><span>${t('Position')}</span><span>${lat.toFixed(2)}°, ${lon.toFixed(2)}°</span></div>
      ${time ? `<div class="tt-row"><span></span><span>${timeAgo(new Date(time))}</span></div>` : ''}
    </div>
  `);
  if (mag >= 4) {
    logEntry('USGS', `M${mag.toFixed(1)} · ${place.slice(0, 40)}`, 'eq');
  }
}
function startEq() {
  if (eqTimer) return;
  fetchEarthquakes();
  eqTimer = setInterval(fetchEarthquakes, 60000);
}
function stopEq() {
  if (eqTimer) { clearInterval(eqTimer); eqTimer = null; }
}

// --- Stream toggle UI ---
const streamHandlers = {
  wiki:  { start: startWiki,  stop: stopWiki  },
  bsky:  { start: startBsky,  stop: stopBsky  },
  eq:    { start: startEq,    stop: stopEq    },
  eonet: { start: startEonet, stop: stopEonet },
  sats:  { start: startSats,  stop: stopSats  },
};
document.querySelectorAll('.stream-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = btn.dataset.stream;
    const active = btn.classList.toggle('active');
    if (active) streamHandlers[s].start();
    else streamHandlers[s].stop();
  });
});

// Auto-start: every stream on page load (user can toggle off)
startWiki();
startBsky();
startEq();
startEonet();
startSats();

initYou();
